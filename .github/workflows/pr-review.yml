name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Gather PR diff and changed files
        run: |
          set +x
          gh pr diff "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --patch > "$GITHUB_WORKSPACE/diff.patch"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files -q '.files[].path' > "$GITHUB_WORKSPACE/files.txt"
          echo "diff bytes: $(wc -c < "$GITHUB_WORKSPACE/diff.patch"), files: $(wc -l < "$GITHUB_WORKSPACE/files.txt")"

      - name: Run pr-review (cloud Claude)
        run: |
          pnpm --filter challenge exec tsx src/cli.ts pr-review \
            --diff-file "$GITHUB_WORKSPACE/diff.patch" \
            --files "$GITHUB_WORKSPACE/files.txt" \
            --out "$GITHUB_WORKSPACE/review.md"

      - name: Post review comment
        run: |
          if [ ! -s "$GITHUB_WORKSPACE/review.md" ]; then
            echo "review.md пуст — комментарий не постится"
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --body-file "$GITHUB_WORKSPACE/review.md"
