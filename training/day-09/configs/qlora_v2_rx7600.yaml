# distill-v2 s2 (#189): QLoRA ученика на RX 7600 (ROCm) по рычагам day-09:
# r=8 / alpha=16 / dropout=0.1, данные — hard-mined пул v2, выбор чекпоинта
# по downstream pass@1 на 10 holdout-задачах eval-30.
# Запуск из training/day-09:
#   ..\.venv-rocm\Scripts\python.exe train_student.py --config configs/qlora_v2_rx7600.yaml

model:
  base: "Qwen/Qwen2.5-Coder-1.5B"
  max_seq_length: 512
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 8
  alpha: 16
  dropout: 0.1
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 3
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  gradient_checkpointing: true
  fp16: true
  bf16: false
  logging_steps: 2
  eval_steps: 2
  save_steps: 2
  save_total_limit: 4
  early_stopping_patience: 2
  seed: 42
  report_to: []

downstream:
  enabled: true
  tasks_file: "data/tasks.jsonl"
  holdout: 10
  patience: 2
  max_new_tokens: 256

data:
  train_file: "data/distill_train_v2_split.jsonl"
  val_file: "data/distill_valid_v2.jsonl"

output:
  artifacts_dir: "artifacts-v2"
