# QLoRA NF4 smoke на RX 7600 (ROCm-HIP, TheRock): урезанный прогон рецепта
# training/day-06/configs/qlora.yaml. Отличия только в объёме: 1 эпоха, срезы
# датасета 200/40, частые логи/eval, артефакты в training/rocm/artifacts/.
# Методология рецепта не меняется: NF4 + double-quant + LoRA r=16 + fp16 + sdpa.
# Запуск из корня репо:
#   training/.venv-rocm/Scripts/python.exe training/day-06/train_qlora.py --config ../rocm/configs/qlora-smoke.yaml

model:
  base: "Qwen/Qwen2.5-1.5B-Instruct"
  max_seq_length: 512
  attn_implementation: "sdpa"

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  num_train_epochs: 1
  optim: "paged_adamw_8bit"
  max_grad_norm: 0.3
  gradient_checkpointing: true
  fp16: true
  bf16: false
  logging_steps: 2
  eval_steps: 10
  save_steps: 10
  save_total_limit: 2
  early_stopping_patience: 2
  seed: 42
  report_to: []

data:
  train_file: "../rocm/data/day06-smoke-train.jsonl"
  val_file: "../rocm/data/day06-smoke-val.jsonl"

system_prompt: |
  You are a text-to-SQL engine. Given a SQLite schema and a question,
  output exactly one SQL query and nothing else. Do not use markdown.
  Use only tables and columns from the schema.

output:
  artifacts_dir: "../rocm/artifacts/day06-smoke"
