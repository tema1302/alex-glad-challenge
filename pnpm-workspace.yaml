# pnpm workspace: challenge (CLI/agent монолит) + web (локальный Next.js, день 28).
packages:
  - 'challenge'
  - 'web'

# pnpm 10: список пакетов, которым разрешён postinstall-build (нативные опциональные
# зависимости). esbuild — для tailwind/postcss веб-пакета; bufferutil/utf-8-validate —
# ws-опционалы telegram; es5-ext — транзитив. Без этого pnpm блокирует build-скрипты.
onlyBuiltDependencies:
  - bufferutil
  - es5-ext
  - esbuild
  - utf-8-validate
